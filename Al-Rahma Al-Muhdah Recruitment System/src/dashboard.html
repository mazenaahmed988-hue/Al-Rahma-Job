<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'" />
  <title>منظومة الرحمة المهداة للتوظيف</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="ambient ambient--one"></div>
  <div class="ambient ambient--two"></div>
  <div class="ambient ambient--three"></div>

  <header class="titlebar">
    <div class="titlebar__brand">
      <span>منظومة الرحمة المهداة للتوظيف</span>
    </div>
    <div class="titlebar__controls">
      <button class="titlebar__btn" id="btn-min" title="تصغير" aria-label="تصغير">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button class="titlebar__btn" id="btn-max" title="تكبير" aria-label="تكبير">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="5" y="5" width="14" height="14" rx="2" />
        </svg>
      </button>
      <button class="titlebar__btn titlebar__btn--close" id="btn-close" title="إغلاق" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  </header>

  <main class="dash">
    <!-- ── اللوجو النابض: مؤشر الاتصال بدون أي نصوص إنشائية ── -->
    <section class="hero">
      <div class="hero__glow" id="hero-glow">
        <span class="hero__halo"></span>
        <span class="hero__halo hero__halo--two"></span>
        <img class="hero__logo" src="../logo.jpg" alt="شعار منظومة الرحمة المهداة للتوظيف" />
      </div>
      <h1 class="hero__title">مَنْظُومَةُ الرَّحْمَةِ المُهْدَاةِ لِلتَّوْظِيفِ</h1>
    </section>

    <!-- ── كروت الإحصائيات ── -->
    <div class="cards">
      <div class="card glass">
        <div class="card__top">
          <span class="card__icon card__icon--pending">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3.5 2" />
            </svg>
          </span>
          <span class="card__title">في الانتظار</span>
        </div>
        <div class="card__value" id="card-pending">0</div>
        <div class="card__hint">بانتظار الرفع</div>
      </div>

      <div class="card glass">
        <div class="card__top">
          <span class="card__icon card__icon--done">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </span>
          <span class="card__title">مكتملة</span>
        </div>
        <div class="card__value" id="card-done">0</div>
        <div class="card__hint">تم التسليم</div>
      </div>

      <div class="card glass">
        <div class="card__top">
          <span class="card__icon card__icon--failed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7.5v5M12 16v.01" />
            </svg>
          </span>
          <span class="card__title">فاشلة</span>
        </div>
        <div class="card__value" id="card-failed">0</div>
        <div class="card__hint">بحاجة لإعادة</div>
      </div>
    </div>

    <div class="dash__foot">
      <button class="ghost-btn" id="btn-refresh" title="تحديث" aria-label="تحديث">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
      <button class="ghost-btn" id="btn-logout" title="تسجيل الخروج" aria-label="تسجيل خروج">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" />
        </svg>
      </button>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>

</html>
