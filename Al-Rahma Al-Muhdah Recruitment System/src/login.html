<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'" />
  <title>تسجيل الدخول — منظومة الرحمة المهداة للتوظيف</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- خلفية مضيئة -->
  <div class="ambient ambient--one"></div>
  <div class="ambient ambient--two"></div>
  <div class="ambient ambient--three"></div>

  <!-- شريط العنوان -->
  <header class="titlebar">
    <div class="titlebar__brand">
      <img src="../logo.jpg" alt="" />
      <span>منظومة الرحمة المهداة</span>
    </div>
    <div class="titlebar__controls">
      <button class="titlebar__btn" id="btn-min" title="تصغير" aria-label="تصغير">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14" /></svg>
      </button>
      <button class="titlebar__btn" id="btn-max" title="تكبير" aria-label="تكبير">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2" /></svg>
      </button>
      <button class="titlebar__btn titlebar__btn--close" id="btn-close" title="إغلاق" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>
  </header>

  <!-- شاشة الدخول -->
  <main class="auth">
    <section class="auth__card glass">
      <img class="auth__logo" src="../logo.jpg" alt="شعار منظومة الرحمة المهداة للتوظيف" />

      <h1 class="auth__title">مَنْظُومَةُ الرَّحْمَةِ المُهْدَاةِ لِلتَّوْظِيفِ</h1>
      <p class="auth__subtitle">تسجيل الدخول</p>

      <div id="alert-slot"></div>

      <form class="auth__form" id="login-form" novalidate>
        <div class="field">
          <label class="field__label" for="email">البريد الإلكتروني</label>
          <div class="field__wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2" /><path d="m2 7 10 6 10-6" />
            </svg>
            <input class="field__input field__input--ltr" id="email" type="email" dir="ltr"
                   autocomplete="username" placeholder="name@example.com" spellcheck="false" />
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="password">كلمة المرور</label>
          <div class="field__wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input class="field__input field__input--ltr" id="password" type="password" dir="ltr"
                   autocomplete="current-password" placeholder="••••••••" spellcheck="false" />
            <button type="button" class="field__toggle" id="toggle-pass" title="إظهار/إخفاء كلمة المرور" aria-label="إظهار كلمة المرور">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn--primary" id="submit-btn" type="submit">
          <svg id="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" />
          </svg>
          <span id="btn-label">دخول</span>
        </button>
      </form>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
